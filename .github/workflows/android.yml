name: Android CI & Release Build

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test QuickCalc
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease

      - name: Copy Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/QuickCalc-v1.2-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickCalc-v1.2-release-apk
          path: app/build/outputs/apk/release/QuickCalc-v1.2-release.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/QuickCalc-v1.2-release.apk
          name: QuickCalc ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
